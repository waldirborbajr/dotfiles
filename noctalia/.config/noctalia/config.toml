# ~/.config/noctalia/config.toml
# Noctalia Shell config — matched to your Niri setup
# Hot-reloads on save for most settings.

# ── Shell ────────────────────────────────────────────────────────────────────
[shell]
ui_scale = 1.0
corner_radius_scale = 1.0                    # 0 = square, 1 = default, 2 = extra rounded
font_family = "sans-serif"
lang = "pt"                                  # Portuguese UI where available
time_format = "{:%H:%M}"
date_format = "%A, %x"
offline_mode = false
telemetry_enabled = false
polkit_agent = false
password_style = "default"
show_location = true
clipboard_enabled = true
clipboard_auto_paste = "auto"
niri_overview_type_to_launch_enabled = false # set true if you want type-to-launch in overview
middle_click_opens_widget_settings = true

[shell.animation]
enabled = true
speed = 1.0

[shell.shadow]
blur = 12
offset_x = 2
offset_y = 2
alpha = 0.55

[shell.mpris]
blacklist = [] # add player names here to hide them from media widgets

# ── Theme ────────────────────────────────────────────────────────────────────
[theme]
mode = "dark"        # dark | light | auto
source = "wallpaper" # builtin | wallpaper | community | custom
# builtin         = "Noctalia"       # used when source = "builtin"
# community_palette = "Oxocarbon"
wallpaper_scheme = "m3-content" # good default when pulling colors from wallpaper
pure_black_dark = false

# ── Wallpaper ────────────────────────────────────────────────────────────────
[wallpaper]
enabled = true
fill_mode = "crop" # center | crop | fit | stretch | repeat
# fill_color = ""                    # optional fallback color
# transition = ["fade", "wipe", "disc", "stripes", "zoom", "honeycomb"]

# ── OSD ──────────────────────────────────────────────────────────────────────
[osd]
position = "top_right" # top_right | top_left | top_center | bottom_right | bottom_left | bottom_center

# ── Keybinds (internal shell chords) ─────────────────────────────────────────
[keybinds]
validate = ["return", "kp_enter"]
cancel = ["escape"]
left = ["left"]
right = ["right"]
up = ["up"]
down = ["down"]

# ── Bar ──────────────────────────────────────────────────────────────────────
[bar]
order = ["main"]

[bar.main]
position = "top"
enabled = true
auto_hide = false
smart_auto_hide = false
show_on_workspace_switch = true
reserve_space = true
layer = "top"
thickness = 34
background_opacity = 0.92
radius = 14                      # matches your Niri geometry-corner-radius 14
margin_ends = 12
margin_edge = 8                  # slight float
padding = 12
widget_spacing = 6
scale = 1.0
shadow = true
capsule = true                   # modern pill look
capsule_fill = "surface_variant"
capsule_thickness = 0.78
capsule_radius = 10.0
capsule_opacity = 0.95

# Left / Center / Right sections
start = ["launcher", "workspaces", "wallpaper"]
center = ["clock"]
end = [
  "media",
  "tray",
  "notifications",
  "clipboard",
  "network",
  "bluetooth",
  "volume",
  "brightness",
  "battery",
  "control-center",
  "session",
]

# Optional per-monitor override example (uncomment & adjust if needed)
# [bar.main.monitor.hdmi]
# match              = "HDMI-A-1"
# thickness          = 36
# background_opacity = 0.90

# ── Desktop Widgets ──────────────────────────────────────────────────────────
# You already have Alt+R bound to toggle them
[desktop_widgets]
enabled = true

# Example clock widget (edit position/scale after first launch via the GUI)
# [desktop_widgets.widget.clock_main]
# type     = "clock"
# output   = "HDMI-A-1"          # or your primary connector
# cx       = 960.0
# cy       = 200.0
# scale    = 1.4
# rotation = 0.0
#
# [desktop_widgets.widget.clock_main.settings]
# format = "{:%H:%M}"

# ── Notifications ────────────────────────────────────────────────────────────
[notification]
# enable_daemon = true               # usually leave default
# history_limit = 50
# timeout_ms    = 5000

# ── Location (for weather / auto theme / night light) ────────────────────────
# [location]
# latitude  = -23.55                 # example São Paulo – change to yours
# longitude = -46.63
# # or use city name if the geocoder is available

# ── Hooks (optional) ─────────────────────────────────────────────────────────
# [hooks]
# started = "notify-send 'Noctalia' 'Shell started'"
# battery_low_percent_threshold = 15
